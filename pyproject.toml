[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anchorite"
version = "0.5.2"
authors = [
    { name = "Tobias Sargeant", email = "tobias.sargeant@gmail.com" },
]
description = "Spatial text alignment and resolution for document OCR"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "seq-smith>=0.6.0",
    "pypdfium2",
    "fsspec",
]

[dependency-groups]
dev = [
    "pillow>=12.2.0",
    "pre-commit",
    "pyright>=1.1.400",
    "pytest",
    "pytest-asyncio",
    "ruff>=0.14.6",
]

[tool.uv]
# Supply-chain age gate: resolve only releases at least a week old. A project setting, so every
# contributor's lock and CI's `uv sync --locked` agree.
exclude-newer = "7 days"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "S", "ANN", "BLE", "RET", "SIM", "PT", "PTH", "RUF", "D", "TID252"]
# D1xx is docstring *presence* — policy, not lint. Format is enforced when one exists.
ignore = ["ANN401", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
# Absolute imports only.
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["anchorite"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # asserts
    "S108",  # /tmp strings as data
    "S311",  # sampling, not crypto
    "RUF001",
    "RUF002",
    "RUF003",
]
"src/anchorite/md_association.py" = [
    # Module legitimately handles ambiguous Unicode (math-italic letters,
    # multiplication sign, en-dash) as part of NFKC/NFKD normalisation, so
    # the ambiguous-character lints fire on intentional examples.
    "RUF001",
    "RUF002",
    "RUF003",
]
"src/anchorite/pdf_atoms.py" = [
    # The per-glyph normalisation table contains ambiguous Unicode
    # (math-italic letters, en-dash, multiplication sign, soft hyphen, NBSP).
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# An unrecognised key in this table is an error, not a warning: a misspelled option would
# otherwise leave the guard it was meant to set switched off, silently.
strict_config = true

[tool.pyright]
pythonVersion = "3.11"
# Resolve imports from the uv-managed venv, so editor pyright sees installed deps the same way
# `uv run pyright` does.
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
typeCheckingMode = "standard"
