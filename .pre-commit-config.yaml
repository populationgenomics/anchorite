default_language_version:
    python: python3.13
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: 'tests/fixtures'
      - id: trailing-whitespace
        exclude: '\.txt$|\.tsv$'
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: check-added-large-files

  # Markdown formatter. CommonMark-strict, so intraword `_` (snake_case) stays literal and fenced
  # code is untouched. gfm = tables/task-lists/autolinks; frontmatter = YAML headers. Wrap at 120.
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: ["--wrap", "120"]
        exclude: 'tests/fixtures'
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - mdformat-frontmatter==2.1.2

  - repo: https://github.com/populationgenomics/pre-commits
    rev: "e37928f761f17d54aca5cedf93848b40ec7cff26"
    hooks:
      - id: cpg-id-checker

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: local
    hooks:
      # pyright needs the project deps to resolve imports, so it runs in the project env via `uv run`.
      # Whole-project (pass_filenames: false); fires on any staged .py.
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        files: \.py$
        pass_filenames: false
