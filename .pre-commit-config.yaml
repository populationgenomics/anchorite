default_language_version:
    python: python3.13
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: 'tests/fixtures'
      - id: trailing-whitespace
        exclude: '\.txt$|\.tsv$'
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: check-added-large-files

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        exclude: 'tests/fixtures'

  - repo: https://github.com/populationgenomics/pre-commits
    rev: "e37928f761f17d54aca5cedf93848b40ec7cff26"
    hooks:
      - id: cpg-id-checker

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: local
    hooks:
      # pyright needs the project deps to resolve imports, so it runs in the project env via `uv run`.
      # Whole-project (pass_filenames: false); fires on any staged .py.
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        files: \.py$
        pass_filenames: false
